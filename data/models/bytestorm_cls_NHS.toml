[run]
seed = 5454

[dir]
experiment = './experiments'
webhook = ''
dataset = './data/datasets/patches-global'
run = './experiments/bytestorm_cls_NHS'
[dir.scaler]
    mean = './data/datasets/scalers/mean_EP_WP_NA_NI-1980_2009.nc'
    std = './data/datasets/scalers/std_EP_WP_NA_NI-1980_2009.nc'

[torch]
matmul_precision = "medium"
dtype = 'torch.float32'

[lightning]
accelerator = "cuda"
precision = "32-true"

[data]
drivers = ['vo_850', 'msl']
targets = ['patch_cyclone']
basins = ['EP', 'WP', 'NA', 'NI']
label_no_cyclone = -1.0
augmentation = []
classify = true
patches = ['cy','nr','rn']

[model]
monitor = 'val_loss'
cls = 'VGG'
metrics = []
    [model.args]
    in_channels = 2
    out_channels = 1
    activation = 'nn.ReLU'
    out_activation = 'nn.Sigmoid'
    kernel_size = 3

[loss]
cls = "nn.BCELoss"
[loss.args]

[optimizer]
cls = "torch.optim.AdamW"
    [optimizer.args]
        lr = 8e-5
        betas = [0.9, 0.95]
        weight_decay = 1e-4

[scheduler]
    [scheduler.warmup]
        total_iters = 20 # warmup epochs
        start_factor = 0.0001
        end_factor = 1.0
    [scheduler.annealing]
        eta_min = 5e-6 # minimum learning rate

[train]
epochs = 150
batch_size = 2048 # 8192 # reduced since we have 4 basins
drop_remainder = true
accumulation_steps = 1
