[run]
seed = 542

[dir]
experiment = './experiments'
webhook = ''
dataset = './data/datasets/patches-global'
run = './experiments/bytestorm_loc_SHS'
[dir.scaler]
    mean = './data/datasets/scalers/mean_SI_SP-1980_2009.nc'
    std = './data/datasets/scalers/std_SI_SP-1980_2009.nc'

[torch]
matmul_precision = "medium"
dtype = 'torch.float32'

[lightning]
accelerator = "cuda"
precision = "32-true"

[data]
drivers = ['vo_850', 'msl']
targets = ['patch_cyclone']
basins = ['SI', 'SP']
label_no_cyclone = -1.0
augmentation = []
classify = false
patches = ['cy']

[model]
monitor = 'val_loss'
cls = 'VGG'
metrics = []
    [model.args]
    in_channels = 2
    out_channels = 2
    activation = 'nn.ReLU'
    kernel_size = 3
    init_std = 0.03

[loss]
cls = "nn.L1Loss"
[loss.args]

[optimizer]
cls = "torch.optim.AdamW"
    [optimizer.args]
        lr = 5e-4
        betas = [0.9, 0.95]
        weight_decay = 1e-4

[scheduler]
    [scheduler.warmup]
        total_iters = 20 # warmup epochs
        start_factor = 0.0001
        end_factor = 1.0
    [scheduler.annealing]
        eta_min = 5e-8 # minimum learning rate

[train]
epochs = 150
batch_size = 4096 # 8192, reduced since we have 2 basins
drop_remainder = true
accumulation_steps = 1
